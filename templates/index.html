<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperium Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f14;
            --card-bg: #161a23;
            --accent: #00d2ff;
            --text: #ffffff;
            --text-sub: #8a99ad;
            --green: #00e676;
            --red: #ff5252;
            --border: #222938;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        .brand h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: 0.5px; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover { transform: translateY(-4px); border-color: var(--accent); }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        .card-desc { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 20px; }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .price { font-size: 1.2rem; font-weight: 800; color: var(--green); }
        
        .stock { font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: 600; }
        .in-stock { background: rgba(0, 230, 118, 0.1); color: var(--green); }
        .out-stock { background: rgba(255, 82, 82, 0.1); color: var(--red); }

        .btn-buy {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--accent);
            color: #000;
            font-weight: 700;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 15px;
        }

        .btn-buy.disabled {
            background: #2a3241;
            color: var(--text-sub);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="{{ url_for('static', filename='logo.gif') }}" alt="Logo Imperium" onerror="this.style.display='none'">
            <h1>IMPERIUM STORE</h1>
        </div>
    </header>

    <div class="container">
        <div class="grid">
            {% for sku, item in produtos.items() %}
                <div class="card">
                    <div>
                        <h2 class="card-title">{{ item.nome }}</h2>
                        <p class="card-desc">{{ item.descricao }}</p>
                    </div>
                    <div>
                        <div class="card-footer">
                            <span class="price">R$ {{ "%.2f"|format(item.preco) }}</span>
                            {% if item.estoque > 0 %}
                                <span class="stock in-stock">Estoque: {{ item.estoque }}</span>
                            {% else %}
                                <span class="stock out-stock">Esgotado</span>
                            {% endif %}
                        </div>
                        
                        {% if item.estoque > 0 %}
                            <a href="https://discord.gg" target="_blank" class="btn-buy">Comprar</a>
                        {% else %}
                            <a href="#" class="btn-buy disabled">Indisponível</a>
                        {% endif %}
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
